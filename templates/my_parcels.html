<!DOCTYPE html>
<html>
<head>
    <title>My Parcels</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .search-box { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h2>Seller Dashboard - My Parcels</h2>
    <a href="/register">+ Register New Parcel</a>

    <div class="search-box" style="margin-top: 20px;">
        <form method="GET" action="/my-parcels">
            <input type="text" name="search" placeholder="Search Tracking No or Name" value="{{ search_query }}">
            <button type="submit">Search</button>
            <a href="/my-parcels"><button type="button">Clear</button></a>
        </form>
    </div>

    <table>
        <tr>
            <th>Tracking Number</th>
            <th>Recipient Name</th>
            <th>Status</th>
            <th>Date Registered</th>
        </tr>
        {% for parcel in parcels %}
        <tr>
            <td>{{ parcel[0] }}</td>
            <td>{{ parcel[1] }}</td>
            <td>{{ parcel[2] }}</td>
            <td>{{ parcel[3] }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4">No parcels found.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
